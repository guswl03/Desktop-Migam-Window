<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1560" viewBox="0 0 1380 1560">
  <title>Gamjabot legendary raw costume audit</title>
  <defs>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
