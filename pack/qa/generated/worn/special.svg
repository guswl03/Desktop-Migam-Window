<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <title>Gamjabot special worn costume audit</title>
  <defs>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f1f1f1" />
      <rect width="8" height="8" fill="#d8d8d8" />
      <rect x="8" y="8" width="8" height="8" fill="#d8d8d8" />
    </pattern>
    <style>
      text { font-family: "Segoe UI", sans-serif; fill: #f4f4f5; }
      .label { font: 700 12px Consolas, monospace; fill: #7fd7ff; }
      .name { font-size: 17px; font-weight: 700; }
      .meta { font: 12px Consolas, monospace; fill: #ffcf53; }
      .observation { font-size: 11px; fill: #d8d8dc; }
      .warning { font: 700 11px Consolas, monospace; fill: #ff8f70; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#17181c" />

  <g class="costume-cell" data-id="special_001">
    <rect x="6" y="6" width="268" height="348" rx="8" fill="#222329" stroke="#5b5d67" />
    <text x="16" y="28" class="label">WORN · special_001</text>
    <rect x="52" y="40" width="176" height="208" fill="url(#checker)" stroke="#777" />
    <svg x="92" y="58" width="96" height="104" viewBox="0 0 96 104" overflow="hidden">
      <image href="../../../../images/characters/gamjabot/references/base-spritesheet-extended.png" x="0" y="0" width="768" height="1144" />
    </svg>
    <image href="../../../special/special_001.png" x="84" y="50" width="112" height="112" preserveAspectRatio="xMidYMid meet" />
    <text x="16" y="276" class="name">원조 감자 개발자 — 감자 새싹 왕관, 개발자 후드, 감자봇의 원형 입 문양을 활용한 황금 배지</text>
    <text x="16" y="300" class="meta">full · x -8 · y -8 · size 112</text>
    <text x="16" y="322" class="warning">none</text>
    <text x="16" y="340" class="observation">원조 감자 개발자 — 감자 새싹 왕관, 개발자 후드, 감자봇의 원형 입 문양을 활용한 </text>
  </g>
  <g class="costume-cell" data-id="special_002">
    <rect x="286" y="6" width="268" height="348" rx="8" fill="#222329" stroke="#5b5d67" />
    <text x="296" y="28" class="label">WORN · special_002</text>
    <rect x="332" y="40" width="176" height="208" fill="url(#checker)" stroke="#777" />
    <svg x="372" y="58" width="96" height="104" viewBox="0 0 96 104" overflow="hidden">
      <image href="../../../../images/characters/gamjabot/references/base-spritesheet-extended.png" x="0" y="0" width="768" height="1144" />
    </svg>
    <image href="../../../special/special_002.png" x="368" y="28" width="104" height="104" preserveAspectRatio="xMidYMid meet" />
    <text x="296" y="276" class="name">숨겨진 Stitch 기록관 — 다섯 색상 조각을 이어 만든 패치워크 후드와 감자봇 원형 입 문양 잠금장식</text>
    <text x="296" y="300" class="meta">head · x -4 · y -30 · size 104</text>
    <text x="296" y="322" class="warning">none</text>
    <text x="296" y="340" class="observation">패치워크 천과 금빛 테두리가 연결된 기록관 후드 한 개이며 별도 구성품이나 잘린 조각은</text>
  </g>
  <g class="costume-cell" data-id="special_003">
    <rect x="566" y="6" width="268" height="348" rx="8" fill="#222329" stroke="#5b5d67" />
    <text x="576" y="28" class="label">WORN · special_003</text>
    <rect x="612" y="40" width="176" height="208" fill="url(#checker)" stroke="#777" />
    <svg x="652" y="58" width="96" height="104" viewBox="0 0 96 104" overflow="hidden">
      <image href="../../../../images/characters/gamjabot/references/base-spritesheet-extended.png" x="0" y="0" width="768" height="1144" />
    </svg>
    <image href="../../../special/special_003.png" x="644" y="50" width="112" height="112" preserveAspectRatio="xMidYMid meet" />
    <text x="576" y="276" class="name">다섯 시트의 큐레이터 — 다섯 색상 탭과 감자봇 나선 문양 잠금장식을 단 박물관 큐레이터 세트</text>
    <text x="576" y="300" class="meta">full · x -8 · y -8 · size 112</text>
    <text x="576" y="322" class="warning">none</text>
    <text x="576" y="340" class="observation">다섯 색상 천 조각과 나선 잠금장식이 한 모자에 결합된 큐레이터 모자 한 개이며 별도 </text>
  </g>
</svg>
