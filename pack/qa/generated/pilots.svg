<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="700" viewBox="0 0 2300 700">
  <title>New catalog style-lock pilots</title>
  <defs>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f1f1f1" />
      <rect width="8" height="8" fill="#d8d8d8" />
      <rect x="8" y="8" width="8" height="8" fill="#d8d8d8" />
    </pattern>
    <style>
      text { font-family: "Segoe UI", sans-serif; fill: #f4f4f5; }
      .section { font: 700 12px Consolas, monospace; fill: #aeb2c0; letter-spacing: 1px; }
      .id { font: 700 18px Consolas, monospace; fill: #7fd7ff; }
      .name { font-size: 19px; font-weight: 700; }
      .meta { font: 13px Consolas, monospace; fill: #ffcf53; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#17181c" />

  <g class="pilot" data-id="common_001" transform="translate(6 6)">
    <rect width="448" height="688" rx="8" fill="#222329" stroke="#aeb2c0" stroke-width="2" />
    <text x="20" y="28" class="section">ISOLATED · 4X LOGICAL</text>
    <rect x="32" y="42" width="384" height="384" fill="url(#checker)" stroke="#777" />
    <image href="../accepted/common/common_001.png" x="32" y="42" width="384" height="384" preserveAspectRatio="xMidYMid meet" image-rendering="pixelated" />
    <text x="20" y="458" class="id">common_001</text>
    <text x="20" y="484" class="name">새벽 우편모</text>
    <text x="20" y="507" class="meta">COMMON · head · x -4 · y -30 · size 104</text>
    <text x="20" y="532" class="section">WORN · PET 96PX</text>
    <rect x="136" y="540" width="176" height="136" fill="url(#checker)" stroke="#777" />
    <svg x="176" y="556" width="96" height="104" viewBox="0 0 96 104" overflow="hidden"><image href="../../../images/characters/gamjabot/references/base-spritesheet-extended.png" x="0" y="0" width="768" height="1144" /></svg>
    <image href="../accepted/common/common_001.png" x="172" y="526" width="104" height="104" preserveAspectRatio="xMidYMid meet" />
  </g>

